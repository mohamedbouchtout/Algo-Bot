name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you expect vs what actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Start the bot with `python main.py`
        2. Wait for a scan cycle
        3. See error in logs
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant logs from `data/bot_logs/trading_bot.log`.
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local machine
        - Docker
        - Cloud server (VPS)
    validations:
      required: true

  - type: dropdown
    id: account-type
    attributes:
      label: Account type
      options:
        - Paper trading
        - Live trading
        - Not connected to IB
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g. 3.11.5"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 22.04, macOS 14, Windows 11"
